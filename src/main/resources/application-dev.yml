# 开发环境配置（profiles.active=dev 时生效，会覆盖 application.yml 里的同名配置）
# 类似前端的 .env.development
#
# 数据库和 Redis 就是 docker-compose 启动的那两个容器。
# 写法 ${MYSQL_PASSWORD:rally_dev_123} 的意思：有 MYSQL_PASSWORD 环境变量就用它，没有就用冒号后面的默认值。
# 默认值和 .env.example 里的一致；如果你改了 .env 里的密码或端口，这里的默认值也要跟着改。

spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rally}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:rally}
    password: ${MYSQL_PASSWORD:rally_dev_123}
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rally_redis_dev}
      database: 0

rally:
  jwt:
    # 签名 token 用的密钥，至少 32 个字符。开发环境随便写一个；上线时必须通过环境变量 JWT_SECRET 换成随机长字符串
    secret: ${JWT_SECRET:rally-dev-secret-only-for-local-development-0123456789}

mybatis-plus:
  configuration:
    # 开发时在控制台打印执行的 SQL，方便学习和排查问题
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    # 我们自己的代码打印 debug 级别日志，方便开发调试
    com.rally: debug
